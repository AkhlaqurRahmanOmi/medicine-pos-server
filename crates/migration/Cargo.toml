[package]
name = "migration"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "migration"
path = "src/main.rs"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
# `cli` is not in the workspace default-features = false set: the binary needs it, the
# library does not.
sea-orm-migration = { workspace = true, features = ["cli"] }
tokio.workspace = true
dotenvy.workspace = true

[lints]
workspace = true
